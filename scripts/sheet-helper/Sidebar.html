<!doctype html>
<html lang="en">
  <head>
    <base target="_top" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --ink: #172b24;
        --muted: #58675f;
        --line: #dbe3dd;
        --paper: #ffffff;
        --wash: #f4f7f4;
        --green: #215c42;
        --soft: #e9f2ea;
        --error: #a02720;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font:
          14px/1.5 system-ui,
          sans-serif;
      }
      header {
        padding: 20px 18px 16px;
        border-bottom: 1px solid var(--line);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .mark {
        background: var(--ink);
        color: white;
        width: 34px;
        height: 34px;
        display: grid;
        place-items: center;
        font-size: 16px;
        font-weight: 800;
        border-radius: 7px;
      }
      .eyebrow {
        font-size: 10px;
        text-transform: uppercase;
        font-weight: 700;
        letter-spacing: 0.12em;
      }
      .brand-name {
        font-size: 17px;
        font-weight: 750;
        letter-spacing: -0.03em;
      }
      .sandbox {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        background: var(--wash);
        padding: 9px 18px;
        color: var(--muted);
        font-size: 11px;
        border-bottom: 1px solid var(--line);
      }
      .sandbox strong {
        color: var(--green);
      }
      main {
        padding: 16px 18px 22px;
      }
      h1 {
        margin: 0 0 6px;
        font-size: 23px;
        line-height: 1.2;
        letter-spacing: -0.04em;
        font-weight: 720;
        overflow-wrap: anywhere;
      }
      h2 {
        margin: 22px 0 10px;
        font-size: 13px;
        font-weight: 700;
      }
      p {
        margin: 0 0 16px;
      }
      .muted,
      .hint {
        color: var(--muted);
      }
      .hint {
        font-size: 12px;
        margin: 5px 0 16px;
      }
      .intro {
        font-size: 13px;
        color: var(--muted);
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
        max-width: 100%;
      }
      button {
        cursor: pointer;
        min-height: 44px;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: white;
        color: var(--ink);
        font-weight: 650;
        text-align: center;
        transition: background-color 0.15s;
      }
      button:hover:not(:disabled) {
        background: var(--wash);
        border-color: #8caa96;
      }
      button:disabled {
        cursor: default;
        opacity: 0.52;
      }
      button.primary {
        color: white;
        background: var(--green);
        border-color: var(--green);
      }
      button.primary:hover:not(:disabled) {
        background: #174932;
      }
      .wide {
        display: block;
        width: 100%;
        margin-top: 10px;
      }
      .back {
        border: 0;
        min-height: 44px;
        margin: -9px 0 10px -10px;
        padding: 9px 10px;
        font-size: 12px;
      }
      :focus-visible {
        outline: 3px solid #a87a13;
        outline-offset: 3px;
      }
      h1:focus {
        outline: none;
      }
      label {
        display: block;
        margin: 15px 0 6px;
        font-size: 12px;
        font-weight: 700;
      }
      input,
      select,
      textarea {
        display: block;
        width: 100%;
        min-width: 0;
        min-height: 44px;
        padding: 10px;
        color: var(--ink);
        background: white;
        border: 1px solid #b6c5bc;
        border-radius: 6px;
      }
      textarea {
        resize: vertical;
        line-height: 1.65;
      }
      input::placeholder,
      textarea::placeholder {
        color: #738078;
      }
      .two {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 5px;
        border-block: 1px solid var(--line);
        margin: 17px 0;
        padding: 14px 0;
      }
      .stats strong {
        display: block;
        font-size: 22px;
        font-variant-numeric: tabular-nums;
        line-height: 1.2;
        font-weight: 680;
      }
      .stats span {
        font-size: 11px;
        color: var(--muted);
      }
      .tag {
        display: inline-block;
        padding: 3px 7px;
        background: var(--soft);
        color: var(--green);
        border-radius: 4px;
        font-size: 10px;
        font-weight: 750;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        margin: 4px 0 6px;
      }
      .liga {
        width: 100%;
        text-align: left;
        margin-bottom: 8px;
        padding: 11px 12px;
      }
      .liga strong,
      .liga small {
        display: block;
        overflow-wrap: anywhere;
      }
      .liga small {
        font-size: 11px;
        font-weight: 400;
        color: var(--muted);
        margin-top: 3px;
      }
      .empty {
        margin: 18px 0;
        padding: 16px;
        background: var(--wash);
        border-radius: 7px;
        font-size: 13px;
      }
      .message {
        padding: 11px 12px;
        border-radius: 6px;
        font-size: 12px;
        margin-bottom: 16px;
        overflow-wrap: anywhere;
      }
      #error {
        color: var(--error);
        background: #fff0ed;
        border: 1px solid #edcbc4;
      }
      #notice {
        color: var(--green);
        background: var(--soft);
      }
      [hidden] {
        display: none !important;
      }
      .issues {
        padding-left: 19px;
        font-size: 12px;
        color: var(--error);
      }
      .issues li {
        margin-bottom: 10px;
        overflow-wrap: anywhere;
      }
      .note {
        background: var(--wash);
        border-left: 3px solid var(--line);
        padding: 10px 12px;
        font-size: 12px;
        color: var(--muted);
      }
      footer {
        margin-top: 22px;
        font-size: 11px;
        line-height: 1.6;
        color: var(--muted);
        border-top: 1px solid var(--line);
        padding-top: 12px;
      }
      @media (prefers-reduced-motion: reduce) {
        button {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="brand">
        <div class="mark" aria-hidden="true">L</div>
        <div>
          <div class="eyebrow">Hockey Liga</div>
          <div class="brand-name">Sheet helper</div>
        </div>
      </div>
    </header>
    <div class="sandbox"><strong>TEST WORKSPACE</strong><span>Website not connected</span></div>
    <main aria-busy="true">
      <div id="error" class="message" role="alert" hidden></div>
      <div id="notice" class="message" role="status" hidden></div>
      <div id="view">
        <h1 tabindex="-1">Opening workspace</h1>
        <p class="intro">Connecting to this spreadsheet…</p>
      </div>
      <footer>
        Changes stay in the TEST tabs.<br />No live results are imported or published.
      </footer>
    </main>
    <script>
      (() => {
        const view = document.getElementById("view");
        const main = document.querySelector("main");
        const errorBox = document.getElementById("error");
        const noticeBox = document.getElementById("notice");
        let state = null;
        let selectedId = "";
        let busy = false;
        let checkResult = null;
        const esc = (value) =>
          String(value ?? "").replace(
            /[&<>"']/g,
            (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c],
          );
        const current = () => state.seasons.find((s) => s.id === selectedId);
        const options = (values, selected = "") =>
          values
            .map(
              (value) =>
                `<option value="${esc(value)}" ${value === selected ? "selected" : ""}>${esc(value)}</option>`,
            )
            .join("");
        const feedback = (box, text) => {
          box.textContent = text;
          box.hidden = !text;
        };
        function show(markup) {
          view.innerHTML = markup;
          feedback(errorBox, "");
          feedback(noticeBox, "");
          view.querySelector("h1")?.focus();
        }
        function rpc(method, input, success) {
          if (busy) return;
          busy = true;
          feedback(errorBox, "");
          main.setAttribute("aria-busy", "true");
          const controls = Array.from(
            document.querySelectorAll("button,input,select,textarea"),
            (node) => [node, node.disabled],
          );
          controls.forEach(([node]) => {
            node.disabled = true;
          });
          function finish() {
            busy = false;
            main.setAttribute("aria-busy", "false");
            controls.forEach(([node, disabled]) => {
              if (node.isConnected) node.disabled = disabled;
            });
          }
          function fail(error) {
            finish();
            feedback(
              errorBox,
              error?.message || "Could not save. Your input is still here; try again.",
            );
          }
          try {
            const runner = google.script.run
              .withFailureHandler(fail)
              .withSuccessHandler((result) => {
                finish();
                try {
                  success(result);
                } catch (error) {
                  fail(error);
                }
              });
            if (input === undefined) runner[method]();
            else runner[method](input);
          } catch (error) {
            fail(error);
          }
        }
        function updated(next, message) {
          state = next;
          home();
          feedback(noticeBox, message);
        }
        function backHeading(title, subtitle) {
          return `<button type="button" class="back" data-action="home" aria-label="Back">← Back</button><h1 tabindex="-1">${esc(title)}</h1><p class="intro">${esc(subtitle)}</p>`;
        }
        function home() {
          if (!state.seasons.length) {
            show(
              `<h1 tabindex="-1">Your next season<br />starts here.</h1><p class="intro">Set up your ligas and teams. Keep fixtures and results in Sheets.</p><div class="empty"><strong>A clean test workspace</strong><br />Create a draft from scratch. Nothing changes on the live website.</div><button class="primary wide" data-action="season">New season</button>`,
            );
            return;
          }
          if (!current()) selectedId = state.currentSeasonId || state.seasons[0].id;
          const season = current();
          show(
            `<label for="season-picker" style="margin-top:0">Season</label><select id="season-picker">${state.seasons.map((s) => `<option value="${esc(s.id)}" ${s.id === selectedId ? "selected" : ""}>${esc(s.id)} · ${esc(s.name)}</option>`).join("")}</select><div style="margin-top:18px"><span class="tag">${esc(season.status)}</span><h1 tabindex="-1">${esc(season.name)}</h1></div><div class="stats"><div><strong>${season.ligas.length}</strong><span>Ligas</span></div><div><strong>${season.fixturesCount}</strong><span>Fixtures</span></div><div><strong>${season.playedCount}</strong><span>Played</span></div></div><h2>Ligas & teams</h2>${season.ligas.length ? season.ligas.map((liga, i) => `<button class="liga" data-action="edit-liga" data-index="${i}"><strong>${esc(liga.name)}</strong><small>${liga.teams.length} teams · Edit setup</small></button>`).join("") : '<p class="hint">Add a liga and its teams before creating fixtures.</p>'}<button class="wide" data-action="liga">Add liga</button><h2>Fixtures & results</h2><button class="primary wide" data-action="fixture" ${season.ligas.length ? "" : "disabled"}>Add fixture</button><button class="wide" data-action="open">Open fixture sheet</button><p class="hint">Enter scores in the sheet, then check this season.</p><button class="wide" data-action="check">Check season</button><button class="wide" data-action="season">New season</button>`,
          );
          document.getElementById("season-picker").onchange = (e) => {
            selectedId = e.target.value;
            home();
          };
        }
        function seasonForm() {
          show(
            `${backHeading("New season", "Start fresh or reuse a season’s ligas and teams.")}<form id="season-form"><label for="season-id">Season ID</label><input id="season-id" name="id" required minlength="2" maxlength="20" pattern="[A-Za-z0-9][A-Za-z0-9\\-]{1,19}" placeholder="2027-1" autocomplete="off" /><p class="hint">Letters, numbers and hyphens. Must be unique.</p><label for="season-name">Season name</label><input id="season-name" name="name" required maxlength="80" placeholder="2027 · First season" /><label for="copy-from">Starting setup</label><select id="copy-from" name="copyFrom"><option value="">Start from scratch</option>${state.seasons.map((s) => `<option value="${esc(s.id)}">Copy ${esc(s.id)} ligas & teams</option>`).join("")}</select><p class="hint">Copying never carries over fixtures or scores.</p><div class="note">The new season starts as a draft. You decide when it becomes current in this test sheet.</div><button type="submit" class="primary wide">Create draft</button></form>`,
          );
          document.getElementById("season-form").onsubmit = (event) => {
            event.preventDefault();
            const input = Object.fromEntries(new FormData(event.target));
            input.id = input.id.trim().toUpperCase();
            rpc("createSeason", input, (next) => {
              selectedId = input.id;
              updated(next, "Draft created. Add your ligas next.");
            });
          };
        }
        function ligaForm(liga) {
          show(
            `${backHeading(liga ? "Edit liga" : "Add liga", current().name)}<form id="liga-form"><label for="liga-name">Liga name</label><input id="liga-name" name="name" required maxlength="80" value="${esc(liga?.name)}" ${liga ? "readonly" : ""} placeholder="e.g. Social" /><label for="teams">Teams</label><textarea id="teams" name="teams" required rows="7" placeholder="One team per line">${esc(liga?.teams.join("\n"))}</textarea><p class="hint">At least 2 teams. No duplicates. Teams already used in fixtures cannot be removed.</p><button type="submit" class="primary wide">Save liga</button></form>`,
          );
          document.getElementById("liga-form").onsubmit = (event) => {
            event.preventDefault();
            const fields = new FormData(event.target);
            rpc(
              "saveLiga",
              {
                seasonId: selectedId,
                name: fields.get("name"),
                teams: fields
                  .get("teams")
                  .split(/\r?\n/)
                  .map((s) => s.trim())
                  .filter(Boolean),
              },
              (next) => updated(next, "Liga saved. Your team dropdowns are ready."),
            );
          };
        }
        function fixtureForm() {
          const ligas = current().ligas;
          if (!ligas.length) return;
          show(
            `${backHeading("Add fixture", "Schedule a match. Enter the result in the sheet later.")}<form id="fixture-form"><label for="fixture-liga">Liga</label><select id="fixture-liga" name="liga">${options(ligas.map((l) => l.name))}</select><label for="fixture-stage">Stage</label><select id="fixture-stage" name="stage">${options(["League", "Quarter-final", "Semi-final", "Final", "Placement"])}</select><label for="fixture-date">Date</label><input id="fixture-date" name="date" type="date" required /><label for="fixture-time">Time</label><input id="fixture-time" name="time" type="time" required /><p class="hint">Dates and times are in Singapore time.</p><label for="fixture-home">Home team</label><select id="fixture-home" name="home" required></select><label for="fixture-away">Away team</label><select id="fixture-away" name="away" required></select><label for="fixture-venue">Venue</label><input id="fixture-venue" name="venue" maxlength="120" placeholder="Optional" /><label for="fixture-notes">Notes</label><textarea id="fixture-notes" name="notes" rows="2" maxlength="500" placeholder="Optional"></textarea><button type="submit" class="primary wide">Add scheduled fixture</button></form>`,
          );
          function teamOptions() {
            const teams = ligas.find(
              (l) => l.name === document.getElementById("fixture-liga").value,
            ).teams;
            document.getElementById("fixture-home").innerHTML =
              '<option value="">Choose a team</option>' + options(teams);
            document.getElementById("fixture-away").innerHTML =
              '<option value="">Choose a team</option>' + options(teams);
          }
          document.getElementById("fixture-liga").onchange = teamOptions;
          teamOptions();
          document.getElementById("fixture-form").onsubmit = (event) => {
            event.preventDefault();
            const input = {
              ...Object.fromEntries(new FormData(event.target)),
              seasonId: selectedId,
            };
            rpc("addFixture", input, (next) =>
              updated(next, "Fixture added. Open the fixture sheet to enter scores."),
            );
          };
        }
        function check() {
          rpc("getHelperState", undefined, (next) => {
            state = next;
            checkFreshSeason();
          });
        }
        function checkFreshSeason() {
          rpc("validateSeason", selectedId, (result) => {
            checkResult = result;
            show(
              `${backHeading("Season check", current().name)}<span class="tag">${result.valid ? "Ready in test sheet" : "Needs attention"}</span><p class="intro">${result.fixtureCount} fixture rows checked.</p>${result.errors.length ? `<ul class="issues">${result.errors.map((s) => `<li>${esc(s)}</li>`).join("")}</ul>` : '<div class="note">No validation errors found. This checks fixture data, not standings rules.</div>'}${result.warnings.length ? `<h2>Notes</h2><ul class="issues">${result.warnings.map((s) => `<li>${esc(s)}</li>`).join("")}</ul>` : ""}<button class="wide" data-action="open">Open fixture sheet</button><button class="primary wide" data-action="confirm-current" ${result.valid ? "" : "disabled"}>Make current in test sheet</button><p class="hint">Local only. Does not publish or switch the website.</p>`,
            );
          });
        }
        view.addEventListener("click", (event) => {
          const button = event.target.closest("button[data-action]");
          if (!button || button.disabled || busy) return;
          const action = button.dataset.action;
          if (action === "home") home();
          if (action === "season") seasonForm();
          if (action === "liga") ligaForm();
          if (action === "edit-liga") ligaForm(current().ligas[Number(button.dataset.index)]);
          if (action === "fixture") fixtureForm();
          if (action === "open")
            rpc("openSeasonSheet", selectedId, () =>
              feedback(
                noticeBox,
                "Fixture sheet opened. Enter both scores and set Status to Played.",
              ),
            );
          if (action === "check") check();
          if (action === "confirm-current" && checkResult?.valid) {
            show(
              `${backHeading("Make this current?", current().name)}<div class="note">The previous test season becomes archived in the TEST tabs. All fixtures and scores are kept. The live website is unchanged.</div><button class="primary wide" data-action="activate">Confirm local switch</button><button class="wide" data-action="home">Cancel</button>`,
            );
          }
          if (action === "activate")
            rpc("activateSeason", selectedId, (next) =>
              updated(next, "Current test season switched. Live 2026/2 is unchanged."),
            );
        });
        if (!window.google?.script?.run) {
          main.setAttribute("aria-busy", "false");
          show(
            '<h1 tabindex="-1">Google Sheets required</h1><p class="intro">Open this helper from the test spreadsheet.</p><div class="note">Use the Liga helper menu in Google Sheets on a desktop browser. There is no offline or pretend-save mode.</div>',
          );
        } else {
          rpc("getHelperState", undefined, (next) => {
            if (!next?.sandbox) throw new Error("This is not the helper test workspace.");
            state = next;
            home();
          });
        }
      })();
    </script>
  </body>
</html>
