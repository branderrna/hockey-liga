# Single source of truth for the validation gate. Called by ci.yml for pull
# requests and by deploy.yml before any Worker is published, so the checks
# cannot pass in review and then be skipped on the way to production.
name: Checks

on:
  workflow_call: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate fixtures
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npx --no-install tsc --noEmit

      - name: Check dead code and dependencies
        run: npx --no-install knip --include files,exports,dependencies,types

      - name: Build
        run: npm run build
