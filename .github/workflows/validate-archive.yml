# Watches the completed-season Sheet tab, which reaches the site without a
# build. An edit to "2026/1" is read live by the server on the next request:
# no refresh script runs, no test runs, nothing is committed and nothing is
# deployed, so every other gate in this repository is bypassed. The site is
# built to survive a bad row — it drops what it cannot read and says so on the
# page — but surviving is not the same as anyone knowing. This is the half
# that tells you: a failure here is a red run and GitHub's own failure email.
#
# Weekly rather than daily because the tab is a finished season that should not
# be changing. A run is cheap; the point is that a silent break has a ceiling
# of a week rather than forever.
name: Validate completed-season Sheet

on:
  schedule:
    # 03:00 Singapore time (UTC+8) on Monday = 19:00 UTC on Sunday.
    # GitHub's scheduled runs are best-effort and can be delayed under load,
    # so treat this as "early Monday", not exactly 03:00.
    - cron: "0 19 * * 0"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      # No npm ci: the validator uses only Node built-ins and this repo's own
      # source, the same reason refresh-fixtures.yml installs nothing.
      - name: Check every row of the completed-season tab still reads
        run: npm run validate-archive-fixtures
