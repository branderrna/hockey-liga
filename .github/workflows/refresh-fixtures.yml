name: Refresh fixtures from Google Sheet

on:
  schedule:
    # 03:00 Singapore time (UTC+8) every Sunday and Monday = 19:00 UTC the
    # previous day (Sat 19:00 UTC -> Sun 03:00 SGT, Sun 19:00 UTC -> Mon 03:00 SGT)
    - cron: "0 19 * * 6,0"
  workflow_dispatch: {}

permissions:
  contents: write

# If a manual run overlaps the scheduled one, queue rather than run in
# parallel — two concurrent `git push`es here would race and one would fail.
concurrency:
  group: refresh-fixtures
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Fetch latest fixtures/results from the league sheet
        run: npm run refresh-fixtures

      - name: Commit updated data if changed
        id: commit
        run: |
          if git diff --quiet -- src/data/matches.generated.ts; then
            echo "No changes to fixtures/results."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/matches.generated.ts
          git commit -m "chore: fixtures/results refresh"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: refresh
    if: ${{ needs.refresh.outputs.changed == 'true' }}
    uses: ./.github/workflows/deploy.yml
    with:
      branch: main
    secrets: inherit
