name: Refresh fixtures from Google Sheet

on:
  schedule:
    # 03:00 Singapore time (UTC+8) every Sunday and Monday = 19:00 UTC the
    # previous day (Sat 19:00 UTC -> Sun 03:00 SGT, Sun 19:00 UTC -> Mon 03:00 SGT)
    - cron: "0 19 * * 6,0"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write # needed to explicitly trigger deploy.yml below

# If a manual run overlaps the scheduled one, queue rather than run in
# parallel — two concurrent `git push`es here would race and one would fail.
concurrency:
  group: refresh-fixtures
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Fetch latest fixtures/results from the league sheet
        run: npm run refresh-fixtures

      - name: Commit updated data if changed
        id: commit
        run: |
          if git diff --quiet -- src/data/matches.generated.ts; then
            echo "No changes to fixtures/results."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/matches.generated.ts
          git commit -m "chore: fixtures/results refresh"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # A push made with the default GITHUB_TOKEN does NOT trigger other
      # workflows' `on: push` (GitHub's anti-loop protection) — so without
      # this, deploy.yml would never fire after a fixtures update and the
      # live site would silently keep serving stale data. Trigger it
      # explicitly instead of relying on the push event.
      - name: Trigger production deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
