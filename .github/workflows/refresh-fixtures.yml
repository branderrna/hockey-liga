name: Refresh fixtures from Google Sheet

on:
  schedule:
    # 03:00 Singapore time (UTC+8) daily = 19:00 UTC the previous day.
    # This is the safety net, not the primary path: scripts/sheet-refresh-trigger.gs
    # dispatches this workflow within minutes of a sheet edit. The daily run is
    # what keeps fixtures moving if that Apps Script trigger or its token ever
    # breaks silently. GitHub's scheduled runs are best-effort and can be delayed
    # under load, so treat this as "early morning", not exactly 03:00.
    - cron: "0 19 * * *"
  # Dispatched by scripts/sheet-refresh-trigger.gs on a sheet edit, and available
  # manually from the Actions tab.
  workflow_dispatch: {}

permissions:
  contents: write

# If a manual run overlaps the scheduled one, queue rather than run in
# parallel — two concurrent `git push`es here would race and one would fail.
concurrency:
  group: refresh-fixtures
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Fetch latest fixtures/results from the league sheet
        run: npm run refresh-fixtures

      - name: Commit updated data if changed
        run: |
          if git diff --quiet -- src/data/matches.generated.ts; then
            echo "No changes to fixtures/results."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/matches.generated.ts
          git commit -m "chore: fixtures/results refresh"
          git push
