name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Refresh fixtures from Google Sheet"]
    types: [completed]
  # Direct "deploy now" for the two mapped branches. Safe despite accepting an
  # arbitrary ref: the guard below whitelists refs by exact match and never
  # interpolates one into shell source.
  workflow_dispatch: {}

permissions:
  contents: read

# Keyed per-branch so unrelated deploys never cancel each other — only
# redundant deploys of the *same* branch race.
concurrency:
  group: deploy-cloudflare-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  # Nothing reaches a Worker without passing the same gate pull requests do.
  # This also guards the fixtures-refresh path, which reaches this workflow
  # via workflow_run: invalid sheet data fails `npm test` instead of reaching
  # the live site.
  checks:
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') }}
    uses: ./.github/workflows/checks.yml

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      # Resolves the deploy target *before* checkout, build, or any step that
      # sees CLOUDFLARE_API_TOKEN. Nothing here interpolates a ref into shell
      # source: refs arrive via env and are matched, never expanded, because
      # Git permits quote-bearing branch names.
      - name: Validate deployment target
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF: ${{ github.ref }}
          REFRESH_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -eu
          case "$EVENT_NAME:$REF_TYPE:$REF:$REFRESH_BRANCH" in
            push:branch:refs/heads/main:)
              echo "BRANCH_NAME=main" >> "$GITHUB_ENV"
              echo "WORKER_NAME=branderrna-hockey-liga" >> "$GITHUB_ENV"
              ;;
            workflow_dispatch:branch:refs/heads/main:)
              echo "BRANCH_NAME=main" >> "$GITHUB_ENV"
              echo "WORKER_NAME=branderrna-hockey-liga" >> "$GITHUB_ENV"
              ;;
            workflow_run:*:*:main)
              echo "BRANCH_NAME=main" >> "$GITHUB_ENV"
              echo "WORKER_NAME=branderrna-hockey-liga" >> "$GITHUB_ENV"
              ;;
            *)
              echo "Unsupported deployment event or ref" >&2
              exit 1
              ;;
          esac

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'refs/heads/main' || github.ref }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # --name is never omitted: nitro/wrangler would otherwise derive the
      # Worker name from package.json, silently creating a new, disconnected
      # Worker while the real site stops receiving updates (see docs/deploy.md).
      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "3aee331e79416603abc527c463b7c574"
        run: |
          echo "Deploying branch '$BRANCH_NAME' to Worker '$WORKER_NAME'"
          npx --no-install wrangler --cwd .output deploy --name "$WORKER_NAME"
