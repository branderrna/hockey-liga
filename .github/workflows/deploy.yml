name: Deploy to Cloudflare

on:
  push:
    branches: [main, staging]
  workflow_run:
    workflows: ["Refresh fixtures from Google Sheet"]
    types: [completed]

permissions:
  contents: read

# Keyed per-branch so a staging deploy never cancels/blocks a production
# one (or vice versa) — only redundant deploys of the *same* branch race.
concurrency:
  group: deploy-cloudflare-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - name: Validate deployment target
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF: ${{ github.ref }}
          REFRESH_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -eu
          case "$EVENT_NAME:$REF_TYPE:$REF:$REFRESH_BRANCH" in
            push:branch:refs/heads/main:)
              echo "BRANCH_NAME=main" >> "$GITHUB_ENV"
              echo "WORKER_NAME=branderrna-hockey-liga" >> "$GITHUB_ENV"
              ;;
            push:branch:refs/heads/staging:)
              echo "BRANCH_NAME=staging" >> "$GITHUB_ENV"
              echo "WORKER_NAME=branderrna-hockey-liga-staging" >> "$GITHUB_ENV"
              ;;
            workflow_run:*:*:main)
              echo "BRANCH_NAME=main" >> "$GITHUB_ENV"
              echo "WORKER_NAME=branderrna-hockey-liga" >> "$GITHUB_ENV"
              ;;
            *)
              echo "Unsupported deployment event or ref" >&2
              exit 1
              ;;
          esac

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'refs/heads/main' || github.ref }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "3aee331e79416603abc527c463b7c574"
        run: |
          echo "Deploying branch '$BRANCH_NAME' to Worker '$WORKER_NAME'"
          npx --no-install wrangler --cwd .output deploy --name "$WORKER_NAME"
