name: Deploy to Cloudflare

on:
  push:
    branches: [main, staging]
  workflow_call:
    inputs:
      branch:
        description: Branch to deploy
        required: true
        type: string
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true

permissions:
  contents: read

# Keyed per-branch so a staging deploy never cancels/blocks a production
# one (or vice versa) — only redundant deploys of the *same* branch race.
concurrency:
  group: deploy-cloudflare-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')) || (github.event_name == 'workflow_call' && ((github.ref == 'refs/heads/main' && inputs.branch == 'main') || (github.ref == 'refs/heads/staging' && inputs.branch == 'staging'))) }}
    runs-on: ubuntu-latest
    env:
      BRANCH_NAME: ${{ inputs.branch || github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.branch || github.ref }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Set Worker name for this branch
        # main -> the live production Worker (custom domain points here).
        # staging -> a separate Worker for testing, its own *.workers.dev URL.
        # Explicit branch mapping on purpose — a wrong Worker name here
        # means deploys silently stop reaching the real site (see git history).
        run: |
          case "$BRANCH_NAME" in
            main)
              echo "WORKER_NAME=branderrna-hockey-liga" >> "$GITHUB_ENV"
              ;;
            staging)
              echo "WORKER_NAME=branderrna-hockey-liga-staging" >> "$GITHUB_ENV"
              ;;
            *)
              echo "No Worker mapping for branch '$BRANCH_NAME'" >&2
              exit 1
              ;;
          esac

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "3aee331e79416603abc527c463b7c574"
        run: |
          echo "Deploying branch '$BRANCH_NAME' to Worker '$WORKER_NAME'"
          npx --no-install wrangler --cwd .output deploy --name "$WORKER_NAME"
