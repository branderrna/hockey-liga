name: Deploy to Cloudflare

on:
  push:
    branches: [main, staging]

permissions:
  contents: read

# Keyed per-branch so a staging deploy never cancels/blocks a production
# one (or vice versa) — only redundant deploys of the *same* branch race.
concurrency:
  group: deploy-cloudflare-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging' }}
    runs-on: ubuntu-latest
    env:
      BRANCH_NAME: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Set Worker name for this branch
        # main -> the live production Worker (custom domain points here).
        # staging -> a separate Worker for testing, its own *.workers.dev URL.
        # Explicit branch mapping on purpose — a wrong Worker name here
        # means deploys silently stop reaching the real site (see git history).
        run: |
          case "$BRANCH_NAME" in
            main)
              echo "WORKER_NAME=branderrna-hockey-liga" >> "$GITHUB_ENV"
              ;;
            staging)
              echo "WORKER_NAME=branderrna-hockey-liga-staging" >> "$GITHUB_ENV"
              ;;
            *)
              echo "No Worker mapping for branch '$BRANCH_NAME'" >&2
              exit 1
              ;;
          esac

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "3aee331e79416603abc527c463b7c574"
        run: |
          echo "Deploying branch '$BRANCH_NAME' to Worker '$WORKER_NAME'"
          npx --no-install wrangler --cwd .output deploy --name "$WORKER_NAME"
