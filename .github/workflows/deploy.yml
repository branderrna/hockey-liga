name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

# If several pushes land close together, only the latest commit's deploy
# matters — cancel any in-flight deploy for an older commit rather than
# have them race to publish.
concurrency:
  group: deploy-cloudflare
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "3aee331e79416603abc527c463b7c574"
        run: npx nitro deploy --prebuilt
